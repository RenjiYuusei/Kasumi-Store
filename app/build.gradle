plugins {
    // No kotlin.android plugin: AGP 9 compiles Kotlin through its built-in
    // support. The Compose compiler plugin is still applied separately.
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

import java.io.InputStreamReader
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

android {
    namespace 'com.kasumi.tool'
    compileSdk 37

    defaultConfig {
        applicationId 'com.kasumi.tool'
        minSdk 24
        targetSdk 36
        versionCode 23
        versionName "2.1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        // App ships Vietnamese strings only; drop the ~80 other locales that
        // AndroidX/Material bundle. Pure APK-size win, no behaviour change.
        resourceConfigurations += ['en', 'vi']
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signing config is set below if keystore.properties exists
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    // Do not embed the dependency blob in the APK (privacy + a few KB).
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        // Keep the build green but make regressions visible in CI output.
        abortOnError false
        warningsAsErrors false
        checkReleaseBuilds true
        // Dependency freshness is tracked separately; it is noise on every build.
        disable 'GradleDependency'
        htmlReport true
        xmlReport true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '**/kotlin-tooling-metadata.json', '**/DebugProbesKt.bin']
        }
    }
}

// Signing config: load from keystore.properties if present (CI populates it)
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def keystoreProps = new Properties()
    keystorePropsFile.withInputStream { stream ->
        keystoreProps.load(new InputStreamReader(stream, java.nio.charset.StandardCharsets.UTF_8))
    }

    def storeFilePath = (keystoreProps.getProperty('storeFile') ?: keystoreProps.getProperty('\ufeffstoreFile'))?.trim()
    def storePasswordValue = keystoreProps.getProperty('storePassword')
    def keyAliasValue = keystoreProps.getProperty('keyAlias')
    def keyPasswordValue = keystoreProps.getProperty('keyPassword')

    def storeFileResolved = storeFilePath ? keystorePropsFile.parentFile.toPath().resolve(storeFilePath).toFile() : null

    def missingKeys = []
    if (!storeFilePath) missingKeys << 'storeFile'
    if (!storePasswordValue) missingKeys << 'storePassword'
    if (!keyAliasValue) missingKeys << 'keyAlias'
    if (!keyPasswordValue) missingKeys << 'keyPassword'
    if (storeFileResolved && !storeFileResolved.exists()) missingKeys << "keystore file (${storeFileResolved})"

    if (missingKeys.isEmpty()) {
        android {
            signingConfigs {
                release {
                    storeFile storeFileResolved
                    storePassword storePasswordValue
                    keyAlias keyAliasValue
                    keyPassword keyPasswordValue
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                }
            }
        }
    } else {
        logger.lifecycle("Skipping release signing config; ${missingKeys.join(', ')} missing or invalid in keystore.properties.")
    }
}


dependencies {
    implementation libs.androidx.core.ktx
    // Required by res/values/themes.xml (Theme.Material3.Dark.NoActionBar).
    implementation libs.android.material
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    implementation libs.okhttp
    implementation libs.gson
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.compose.material3
    implementation libs.compose.ui
    implementation libs.compose.material.icons.extended
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.tooling.preview

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso.core
}
