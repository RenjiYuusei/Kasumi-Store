// Top-level build file. Dependency versions live in gradle/libs.versions.toml.
buildscript {
    dependencies {
        // AGP 9 compiles Kotlin itself ("built-in Kotlin") and pins KGP to the
        // version it was built against (2.2.10 for AGP 9.3.2). This is the
        // documented way to raise it; keep the version in step with `kotlin`
        // in gradle/libs.versions.toml.
        // https://developer.android.com/build/releases/agp-9-0-0-release-notes
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.compose) apply false
}
