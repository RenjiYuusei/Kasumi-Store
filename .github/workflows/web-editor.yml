name: Build and Deploy Web Editor

on:
  push:
    # Only the default branch may publish to Pages; a push to any feature
    # branch used to deploy over the live site.
    branches: [ main ]
    paths:
      - 'tools/web-editor/**'
      - '.github/workflows/web-editor.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/web-editor/**'
      - '.github/workflows/web-editor.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/web-editor/package-lock.json

      - name: Install Dependencies
        working-directory: ./tools/web-editor
        # ci, not install: reproducible from the lockfile and it fails loudly
        # when package.json and the lockfile have drifted apart.
        run: npm ci

      - name: Build
        working-directory: ./tools/web-editor
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tools/web-editor/dist

  deploy:
    # Pull requests build for validation only; they must not publish.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
