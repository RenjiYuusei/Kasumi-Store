# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override* any settings
# specified in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM for the Gradle daemon. 4 GB is enough for this single-module project and
# leaves headroom on 8 GB CI runners; the previous 8 GB heap + 2 GB metaspace
# could not even be honoured on some machines.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# --- Build speed ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

# --- AndroidX / R class ---
android.useAndroidX=true
# Each library's R class contains only its own resources -> smaller R classes.
android.nonTransitiveRClass=true
# R8 in full mode: more aggressive optimisation and shrinking of the release APK.
android.enableR8.fullMode=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon

# Removed on purpose:
#   android.enableResourceOptimizations  -> removed in AGP 8, was a silent no-op
#   android.suppressUnsupportedCompileSdk=34 -> stale, compileSdk is 35
#   org.gradle.configureondemand -> not supported/ discouraged with AGP, and
#                                   incompatible with the configuration cache
